title: Run grid
description: Every run as a card, three across — the index behind the homepage rail
fields:
    items:
        type: repeater
        label: Runs
        add_button_label: "Add run"
        item_label: title
        source: collections.useCases
        sub_fields:
            system:
                type: text
                label: System
                default: "ERP"
            metric:
                type: text
                label: Headline figure
                default: "4 hrs"
            metricWas:
                type: text
                label: Figure caption
                default: "was 9 days"
            title:
                type: text
                label: Title
                default: "New run"
            blurb:
                type: textarea
                label: Summary
                rows: 3
                default: "What this run does, in one or two sentences."
            tone:
                type: select
                label: Card tone
                default: "mist"
                options:
                    mist: Mist
                    mint: Mint
            linkText:
                type: text
                label: Link text
                default: "Read the run"
            link:
                type: url
                label: Link
                default: "/use-cases"
