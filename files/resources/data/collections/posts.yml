# Column types for posts.json — the source of truth the builder reads.
# The content column is rich text and opens in the rich editor; every other
# column shows on the listing and in the post's header.
fields:
    slug:
        type: text
    title:
        type: text
    description:
        type: textarea
    tag:
        type: text
    dateFormatted:
        type: text
    readTime:
        type: text
    link:
        type: url
    content:
        type: richtext
